<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Прототип игры</title>
<style>
  html,body{ margin:0; padding:0; overflow:hidden; background:#000; height:100%; touch-action:none; }
  #gameCanvas{ display:block; width:100%; height:100%; }

  #rotateOverlay{
    position:fixed; inset:0; background:#0c0e11;
    display:none; align-items:center; justify-content:center;
    flex-direction:column; color:#fff; z-index:999; text-align:center; padding:24px;
    font-family:sans-serif;
  }
  @media (orientation: portrait){
    #rotateOverlay{ display:flex; }
  }
  #rotateOverlay .icon{ font-size:44px; margin-bottom:14px; animation:rot 1.6s ease-in-out infinite; }
  @keyframes rot{ 0%,100%{ transform:rotate(0deg); } 50%{ transform:rotate(90deg); } }

  .ui{ position:fixed; inset:0; pointer-events:none; font-family:sans-serif; }

  #joyBase{
    position:absolute; left:26px; bottom:30px;
    width:110px; height:110px; border-radius:50%;
    background:rgba(255,255,255,0.12);
    border:2px solid rgba(255,255,255,0.3);
    pointer-events:auto; z-index:6;
  }
  #joyStick{
    position:absolute; left:50%; top:50%;
    width:50px; height:50px; margin:-25px 0 0 -25px;
    border-radius:50%;
    background:rgba(255,255,255,0.55);
  }

  #lookZone{
    position:absolute; right:0; top:0; bottom:0; width:55%;
    pointer-events:auto; z-index:1;
  }

  #jumpBtn{
    position:absolute; right:26px; bottom:30px;
    width:70px; height:70px; border-radius:50%;
    background:rgba(255,255,255,0.15);
    border:2px solid rgba(255,255,255,0.3);
    color:#fff; font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    pointer-events:auto; z-index:6;
  }

  #hint{
    position:absolute; top:16px; left:16px; max-width:60%;
    color:rgba(255,255,255,0.7); font-size:11px; line-height:1.5;
  }

  /* ---------- crosshair (hip-fire, hidden while aiming) ---------- */
  #crosshair{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:22px; height:22px; pointer-events:none;
  }
  #crosshair:before, #crosshair:after{
    content:''; position:absolute; background:rgba(255,255,255,0.85);
  }
  #crosshair:before{ left:50%; top:0; width:2px; height:100%; margin-left:-1px; }
  #crosshair:after{ top:50%; left:0; height:2px; width:100%; margin-top:-1px; }

  /* ---------- collimator (red-dot) sight overlay ---------- */
  #scopeVignette{
    position:absolute; inset:0; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 50%, transparent 0%, transparent 34%, rgba(4,6,5,0.45) 58%, rgba(2,3,3,0.92) 78%);
    transition:opacity 0.15s ease;
  }
  #collimator{
    position:absolute; left:50%; top:calc(50% - 42px); transform:translate(-50%,-50%) scale(0.7);
    width:150px; height:150px; pointer-events:none; opacity:0;
    transition:opacity 0.15s ease, transform 0.15s ease;
  }
  #collimator .glass{
    position:absolute; inset:14px; border-radius:50%;
    background:radial-gradient(circle at 42% 38%, rgba(150,255,190,0.10), rgba(20,40,30,0.04) 60%, transparent 75%);
    border:1px solid rgba(160,255,190,0.28);
  }
  #collimator .ring{
    position:absolute; inset:0; border-radius:50%;
    border:1.5px solid rgba(180,255,205,0.35);
    box-shadow:0 0 18px 2px rgba(120,255,160,0.12) inset;
  }
  #collimator .dot{
    position:absolute; left:50%; top:50%; width:6px; height:6px;
    margin:-3px 0 0 -3px; border-radius:50%;
    background:#a6ffb8;
    box-shadow:0 0 4px 1px #baffca, 0 0 14px 5px rgba(140,255,170,0.55), 0 0 26px 10px rgba(140,255,170,0.22);
    animation:dotPulse 1.8s ease-in-out infinite;
  }
  @keyframes dotPulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.72; }
  }
  #collimator.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }

  #aimBtn{
    position:absolute; right:110px; bottom:120px;
    width:56px; height:56px; border-radius:50%;
    background:rgba(140,255,156,0.18);
    border:2px solid rgba(140,255,156,0.45);
    color:#fff; font-size:20px;
    display:flex; align-items:center; justify-content:center;
    pointer-events:auto; z-index:6;
  }
  #aimBtn.on{ background:rgba(140,255,156,0.45); }

  #fireBtn{
    position:absolute; right:26px; bottom:120px;
    width:76px; height:76px; border-radius:50%;
    background:rgba(229,72,77,0.35);
    border:2px solid rgba(255,120,120,0.6);
    color:#fff; font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    pointer-events:auto; z-index:6;
  }
  #fireBtn.firing, #altFireBtn.firing{ background:rgba(229,72,77,0.65); }

  #altFireBtn{
    position:absolute; left:220px; bottom:150px;
    width:70px; height:70px; border-radius:50%;
    background:rgba(255,159,67,0.35);
    border:2px solid rgba(255,190,120,0.6);
    color:#fff; font-size:11px; font-weight:700;
    display:none; align-items:center; justify-content:center;
    pointer-events:auto; z-index:6;
    text-align:center;
  }

  #settingsBtn{
    position:absolute; top:64px; left:16px;
    width:32px; height:32px; border-radius:50%;
    background:rgba(20,20,25,0.7);
    border:1px solid rgba(255,255,255,0.25);
    color:#fff; font-size:15px;
    display:flex; align-items:center; justify-content:center;
    pointer-events:auto; z-index:6;
  }

  #settingsPanel{
    position:absolute; left:12px; right:12px; bottom:-320px;
    background:rgba(16,18,22,0.94);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:16px; padding:16px;
    pointer-events:auto; z-index:20;
    transition:bottom 0.25s ease;
    font-size:13px; color:#fff;
  }
  #settingsPanel.open{ bottom:16px; }
  #settingsPanel h3{ margin:0 0 12px; font-size:14px; }
  .settRow{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .settRow label{ flex-shrink:0; opacity:0.85; }
  .settRow input[type=range]{ flex:1; }
  #settingsClose{
    width:100%; padding:10px; border-radius:10px; border:none;
    background:rgba(255,255,255,0.15); color:#fff; font-weight:700;
  }
  #positionBtn{
    width:100%; padding:10px; border-radius:10px; border:none;
    background:rgba(255,159,67,0.3); border:1px solid rgba(255,190,120,0.5);
    color:#fff; font-weight:700; margin-bottom:10px;
  }
  #posDoneBtn{
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    padding:10px 18px; border-radius:20px;
    background:rgba(62,207,110,0.9); color:#0e1a12; font-weight:800; font-size:13px;
    border:none; pointer-events:auto; z-index:30;
    display:none;
    box-shadow:0 6px 18px rgba(0,0,0,0.4);
  }

  #score{
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    color:#fff; font-weight:800; font-size:18px;
    text-shadow:0 1px 4px rgba(0,0,0,0.6);
  }
  #ammo{
    position:absolute; top:42px; left:50%; transform:translateX(-50%);
    color:#ffd88a; font-weight:700; font-size:13px;
    text-shadow:0 1px 4px rgba(0,0,0,0.6);
  }

  #healthWrap{
    position:absolute; top:16px; right:16px; width:110px;
  }
  #healthLabel{ color:#fff; font-size:10px; text-shadow:0 1px 3px rgba(0,0,0,0.6); margin-bottom:2px; text-align:right; }
  #healthBarBg{
    width:100%; height:9px; border-radius:5px;
    background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.25);
    overflow:hidden;
  }
  #healthBarFill{
    height:100%; width:100%; background:linear-gradient(90deg,#5ed36a,#8fe86a);
    transition:width 0.2s ease, background 0.2s ease;
  }

  #holsterBtn{
    position:absolute; right:26px; bottom:206px;
    width:56px; height:56px; border-radius:50%;
    background:rgba(90,110,140,0.3);
    border:2px solid rgba(160,190,220,0.55);
    color:#fff; font-size:19px;
    display:flex; align-items:center; justify-content:center;
    pointer-events:auto; z-index:6;
  }
  #holsterBtn.on{ background:rgba(90,110,140,0.6); }

  #sprintBtn{
    position:absolute; right:110px; bottom:30px;
    width:64px; height:64px; border-radius:50%;
    background:rgba(255,206,84,0.22);
    border:2px solid rgba(255,220,120,0.5);
    color:#fff; font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    pointer-events:auto; z-index:6;
  }
  #sprintBtn.on{ background:rgba(255,206,84,0.55); }
</style>
</head>
<body>
<div id="rotateOverlay"><div class="icon">📱</div>Поверни телефон горизонтально</div>
<canvas id="gameCanvas"></canvas>
<div class="ui">
  <div id="hint">Левый джойстик — движение.<br>Держи ОГОНЬ и веди пальцем — прицел.<br>🎯 — прицелиться через коллиматор.</div>
  <div id="scopeVignette"></div>
  <div id="crosshair"></div>
  <div id="collimator"><div class="glass"></div><div class="ring"></div><div class="dot"></div></div>
  <button id="aimBtn">🎯</button>
  <div id="score">🎯 0</div>
  <div id="ammo">🔫 100/100</div>
  <div id="healthWrap"><div id="healthLabel">❤ 100</div><div id="healthBarBg"><div id="healthBarFill"></div></div></div>
  <button id="settingsBtn">⚙</button>
  <div id="joyBase"><div id="joyStick"></div></div>
  <div id="lookZone"></div>
  <div id="jumpBtn">ПРЫГ</div>
  <button id="holsterBtn">🔫</button>
  <div id="sprintBtn">БЕГ</div>
  <div id="fireBtn">ОГОНЬ</div>
  <div id="altFireBtn">ОГОНЬ 2</div>
  <button id="posDoneBtn">✓ Готово — кнопка тут</button>

  <div id="settingsPanel">
    <h3>Чувствительность камеры</h3>
    <div class="settRow"><label>Поворот</label><input type="range" id="sensSlider" min="40" max="200" value="100"></div>
    <h3>Доп. кнопка огня</h3>
    <div class="settRow"><label>Показывать</label><input type="checkbox" id="altFireToggle"></div>
    <div class="settRow"><label>Размер</label><input type="range" id="altSizeSlider" min="40" max="130" value="70"></div>
    <div class="settRow"><label>Прозрачность</label><input type="range" id="altOpacitySlider" min="15" max="100" value="45"></div>
    <button id="positionBtn">📍 Настроить позицию</button>
    <button id="settingsClose">Готово</button>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script>
(function(){
  const canvas = document.getElementById('gameCanvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8fc7e8);
  scene.fog = new THREE.Fog(0x8fc7e8, 40, 160);

  const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 500);
  scene.add(camera);

  // ---------- lights ----------
  scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x4a7a3a, 0.7));
  scene.add(new THREE.AmbientLight(0xffffff, 0.25));
  const sun = new THREE.DirectionalLight(0xfff2d6, 1.0);
  sun.position.set(40, 60, 20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
  sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
  scene.add(sun);

  // a light that rides with the camera so the view-model gun/hands are always
  // lit nicely, regardless of which way the world's sun happens to be facing
  const viewLight = new THREE.PointLight(0xfff6e0, 0.9, 4);
  viewLight.position.set(0.2, 0.3, 0.3);
  camera.add(viewLight);

  // ---------- ground ----------
  const groundGeo = new THREE.PlaneGeometry(400, 400, 1, 1);
  const groundMat = new THREE.MeshStandardMaterial({ color:0x5e8a3f });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  // ---------- dirt roads through the village ----------
  const roadMat = new THREE.MeshStandardMaterial({ color:0x6e5d46, roughness:1 });
  const roadNS = new THREE.Mesh(new THREE.PlaneGeometry(7, 260), roadMat);
  roadNS.rotation.x = -Math.PI/2; roadNS.position.y = 0.012;
  roadNS.receiveShadow = true;
  scene.add(roadNS);
  const roadEW = new THREE.Mesh(new THREE.PlaneGeometry(260, 6), roadMat);
  roadEW.rotation.x = -Math.PI/2; roadEW.position.set(0, 0.012, 26);
  roadEW.receiveShadow = true;
  scene.add(roadEW);
  function onRoad(x, z){ return Math.abs(x) < 4.5 || Math.abs(z - 26) < 3.8; }

  // ---------- rural houses ----------
  const houses = []; // { group, x, z, footprint, hideSpot }
  const targets = []; // raycast-hittable meshes: npc parts + house walls
  function buildHouse(x, z, rotY){
    const group = new THREE.Group();
    const w = 5 + Math.random()*2, d = 4.2 + Math.random()*1.4, h = 2.6 + Math.random()*0.5;
    const wallMat = new THREE.MeshStandardMaterial({ color: pick([0xdccba0,0x8fb0c4,0xa8654e,0x9a8a68]), roughness:0.9 });
    const roofMat = new THREE.MeshStandardMaterial({ color: pick([0x6b3131,0x5a4632,0x40474a]), roughness:0.85 });
    const doorMat = new THREE.MeshStandardMaterial({ color:0x3d2b1f, roughness:0.85 });
    const glassMat = new THREE.MeshStandardMaterial({ color:0xbfe0f0, roughness:0.3, metalness:0.2, emissive:0x1a2a30, emissiveIntensity:0.15 });
    const chimneyMat = new THREE.MeshStandardMaterial({ color:0x6b5648, roughness:0.9 });

    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
    body.position.y = h/2; body.castShadow = true; body.receiveShadow = true;
    body.userData.house = true;

    const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*0.72, 1.6, 4), roofMat);
    roof.position.y = h + 0.75; roof.rotation.y = Math.PI/4; roof.castShadow = true;

    const chimney = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.9,0.28), chimneyMat);
    chimney.position.set(w*0.25, h+1.1, d*0.15);

    const door = new THREE.Mesh(new THREE.BoxGeometry(0.85,1.7,0.06), doorMat);
    door.position.set(0, 0.85, d/2+0.02);

    const win1 = new THREE.Mesh(new THREE.BoxGeometry(0.55,0.55,0.05), glassMat);
    win1.position.set(-w*0.28, h*0.6, d/2+0.02);
    const win2 = win1.clone(); win2.position.x = w*0.28;
    const winSide = win1.clone(); winSide.rotation.y = Math.PI/2; winSide.position.set(w/2+0.02, h*0.6, 0);

    group.add(body, roof, chimney, door, win1, win2, winSide);
    group.position.set(x, 0, z);
    group.rotation.y = rotY;
    scene.add(group);

    const footprint = Math.max(w, d) * 0.72;
    // "behind the house" from the village center — where villagers run to hide
    const away = new THREE.Vector3(x, 0, z - 26);
    if(away.lengthSq() < 0.01) away.set(1, 0, 0); else away.normalize();
    const hideSpot = new THREE.Vector3(x, 0, z).addScaledVector(away, footprint + 0.9);

    const house = { group, x, z, footprint: footprint + 1.4, hideSpot };
    houses.push(house);
    targets.push(body);
    body.userData.houseRef = house;
    return house;
  }

  const HOUSE_SPOTS = [
    [-34, -18, 0.3], [-30, 10, -0.4], [-14, 42, 0.9], [16, 44, -0.6],
    [34, 14, 0.4], [30, -16, -0.3], [-4, -32, 1.1], [46, -34, -0.9]
  ];
  for(const [x, z, r] of HOUSE_SPOTS) buildHouse(x, z, r);

  // ---------- parked cars ----------
  function buildCar(x, z, rotY){
    const group = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color: pick([0xb23b3b,0x3b5bb2,0xd8d8d8,0x2f2f33,0x3f7a4a]), roughness:0.45, metalness:0.4 });
    const glassMat = new THREE.MeshStandardMaterial({ color:0x1c2530, roughness:0.2, metalness:0.3 });
    const wheelMat = new THREE.MeshStandardMaterial({ color:0x141414, roughness:0.9 });
    const lightMat = new THREE.MeshStandardMaterial({ color:0xfff2c0, emissive:0xfff2c0, emissiveIntensity:0.4 });
    const bumperMat = new THREE.MeshStandardMaterial({ color:0x24262a, roughness:0.6 });

    const base = new THREE.Mesh(new THREE.BoxGeometry(1.7,0.5,3.8), bodyMat);
    base.position.y = 0.5; base.castShadow = true;
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.5,0.5,2.0), bodyMat);
    cabin.position.set(0,0.98,-0.15); cabin.castShadow = true;
    const windshield = new THREE.Mesh(new THREE.BoxGeometry(1.42,0.42,1.9), glassMat);
    windshield.position.set(0,0.99,-0.15);

    const wheelGeo = new THREE.CylinderGeometry(0.32,0.32,0.24,10);
    [[-0.85,0.32,1.25],[0.85,0.32,1.25],[-0.85,0.32,-1.25],[0.85,0.32,-1.25]].forEach(p => {
      const wh = new THREE.Mesh(wheelGeo, wheelMat);
      wh.rotation.z = Math.PI/2;
      wh.position.set(p[0],p[1],p[2]);
      wh.castShadow = true;
      group.add(wh);
    });

    const headlightL = new THREE.Mesh(new THREE.SphereGeometry(0.09,8,8), lightMat);
    headlightL.position.set(-0.55,0.55,1.88);
    const headlightR = headlightL.clone(); headlightR.position.x = 0.55;
    const bumperF = new THREE.Mesh(new THREE.BoxGeometry(1.75,0.18,0.2), bumperMat);
    bumperF.position.set(0,0.32,1.9);
    const bumperB = bumperF.clone(); bumperB.position.z = -1.9;

    group.add(base, cabin, windshield, headlightL, headlightR, bumperF, bumperB);
    group.position.set(x, 0, z);
    group.rotation.y = rotY;
    scene.add(group);
    return group;
  }
  const CAR_SPOTS = [[-27,-16,0.5],[-22,44,1.4],[24,42,-0.7],[38,-14,2.1],[6,-28,0.6]];
  for(const [x,z,r] of CAR_SPOTS) buildCar(x, z, r);

  // ---------- simple trees for a rural feel ----------
  function buildTree(x, z){
    const group = new THREE.Group();
    const trunkMat = new THREE.MeshStandardMaterial({ color:0x5a4530, roughness:0.9 });
    const leafMat = new THREE.MeshStandardMaterial({ color: pick([0x4c7a34,0x3f6b2c,0x578a3d]), roughness:0.85 });
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.22,2.2,7), trunkMat);
    trunk.position.y = 1.1; trunk.castShadow = true;
    const leaves = new THREE.Mesh(new THREE.SphereGeometry(1.3 + Math.random()*0.5, 8, 8), leafMat);
    leaves.position.y = 2.6; leaves.scale.y = 1.15; leaves.castShadow = true;
    group.add(trunk, leaves);
    group.position.set(x, 0, z);
    scene.add(group);
  }
  for(let i=0;i<16;i++){
    let x, z, tries=0;
    do { x=(Math.random()-0.5)*160; z=(Math.random()-0.5)*160; tries++; }
    while((onRoad(x,z) || houses.some(h => Math.hypot(x-h.x,z-h.z) < h.footprint+2)) && tries < 20);
    buildTree(x, z);
  }

  // ---------- 3D grass covering the fields ----------
  const grassMat = new THREE.MeshStandardMaterial({ color:0x6a9a45, roughness:0.9, side:THREE.DoubleSide });
  const grassGeo = new THREE.PlaneGeometry(0.09, 0.38);
  grassGeo.translate(0, 0.19, 0);
  const GRASS_COUNT = 5000;
  const grassMesh = new THREE.InstancedMesh(grassGeo, grassMat, GRASS_COUNT);
  const gDummy = new THREE.Object3D();
  let gPlaced = 0, gTries = 0;
  while(gPlaced < GRASS_COUNT && gTries < GRASS_COUNT * 3){
    gTries++;
    const x = (Math.random()-0.5)*380;
    const z = (Math.random()-0.5)*380;
    if(onRoad(x, z)) continue;
    if(houses.some(h => Math.hypot(x-h.x, z-h.z) < h.footprint)) continue;
    gDummy.position.set(x, 0, z);
    gDummy.rotation.y = Math.random() * Math.PI;
    const s = 0.7 + Math.random()*0.7;
    gDummy.scale.set(s, s*(0.8+Math.random()*0.5), s);
    gDummy.updateMatrix();
    grassMesh.setMatrixAt(gPlaced, gDummy.matrix);
    gPlaced++;
  }
  grassMesh.count = gPlaced;
  scene.add(grassMesh);

  // ---------- drifting clouds ----------
  const clouds = [];
  function spawnClouds(){
    const tex = makeSmokeTexture();
    for(let i=0;i<14;i++){
      const mat = new THREE.SpriteMaterial({ map:tex, color:0xffffff, transparent:true, opacity:0.78, depthWrite:false });
      const spr = new THREE.Sprite(mat);
      const s = 18 + Math.random()*24;
      spr.scale.set(s, s*0.55, 1);
      spr.position.set((Math.random()-0.5)*380, 48+Math.random()*22, (Math.random()-0.5)*380);
      scene.add(spr);
      clouds.push({ sprite:spr, speed: 0.5 + Math.random()*0.7 });
    }
  }
  spawnClouds();
  function updateClouds(dt){
    for(const c of clouds){
      c.sprite.position.x += c.speed * dt;
      if(c.sprite.position.x > 210) c.sprite.position.x = -210;
    }
  }

  // ---------- villagers: peaceful NPCs that live near a house and flee indoors when shot at ----------

  // ---- villager AI: wander near home, flee indoors when scared, come back out later ----
  const NPC_WANDER_SPEED = 0.9, NPC_FLEE_SPEED = 3.1;
  function updateNpcs(dt){
    const now = performance.now();
    for(const npc of npcs){
      if(!npc.alive){
        if(now >= npc.respawnAt){
          npc.alive = true;
          npc.hp = npc.maxHp;
          npc.torso.material.color.copy(npc.torsoColor);
          npc.group.visible = true;
          npc.group.position.copy(npc.home);
          npc.state = 'wander';
          npc.wanderTarget = npc.home.clone();
        }
        continue;
      }

      if(npc.state === 'flee'){
        const target = npc.house.hideSpot;
        const dir = target.clone().sub(npc.group.position); dir.y = 0;
        const dist = dir.length();
        if(dist < 0.3){
          npc.state = 'hidden';
          npc.group.visible = false;
          npc.hideUntil = now + 5000 + Math.random()*4000;
        } else {
          dir.normalize();
          npc.group.position.addScaledVector(dir, NPC_FLEE_SPEED * dt);
          npc.group.rotation.y = Math.atan2(dir.x, dir.z);
        }
      } else if(npc.state === 'hidden'){
        if(now >= npc.hideUntil){
          npc.state = 'wander';
          npc.group.visible = true;
          npc.group.position.copy(npc.home);
          npc.wanderTarget = randPointNear(npc.home.x, npc.home.z, 3);
        }
      } else { // wander
        const dir = npc.wanderTarget.clone().sub(npc.group.position); dir.y = 0;
        const dist = dir.length();
        if(dist < 0.25 || now < npc.pauseUntil){
          if(dist < 0.25 && now >= npc.pauseUntil){
            npc.pauseUntil = now + 1200 + Math.random()*2500;
            npc.wanderTarget = randPointNear(npc.home.x, npc.home.z, 3);
          }
        } else {
          dir.normalize();
          npc.group.position.addScaledVector(dir, NPC_WANDER_SPEED * dt);
          npc.group.rotation.y = Math.atan2(dir.x, dir.z);
        }
      }
    }
  }

  // simple low-poly hand with separated fingers, wrapped around a grip point
  function buildHand(sign, curl){
    const hand = new THREE.Group();
    const palm = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.065, 0.035), skinMat);
    hand.add(palm);
    const fingerCount = 4;
    for(let i=0;i<fingerCount;i++){
      const finger = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.007, 0.055, 6), skinMat);
      finger.position.set(-0.017 + i*0.0115, 0.05, 0.006);
      finger.rotation.x = curl;
      finger.castShadow = true;
      hand.add(finger);
    }
    const thumb = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.007, 0.045, 6), skinMat);
    thumb.position.set(sign*0.03, 0.01, -0.012);
    thumb.rotation.z = sign*1.0;
    thumb.rotation.x = 0.3;
    thumb.castShadow = true;
    hand.add(thumb);
    const forearm = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.032, 0.22, 8), sleeveMat);
    forearm.position.set(0, -0.14, 0);
    forearm.castShadow = true;
    hand.add(forearm);
    palm.castShadow = true;
    return hand;
  }

      const s = (aiming ? 0.45 : 1) * lookSensitivity; // finer control while aiming, like real ADS sensitivity
      yaw -= dx * 0.0045 * s;
      pitch -= dy * 0.0035 * s;
      pitch = Math.max(-1.3, Math.min(1.3, pitch));

    e.preventDefault();
  }, { passive:false });

  // ---------- virtual joystick (tracks its own finger by identifier) ----------

  const JOY_RADIUS = 42;

  function joyMove(clientX, clientY){
    const rect = joyBase.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    let dx = clientX - cx, dy = clientY - cy;
    const dist = Math.min(Math.hypot(dx,dy), JOY_RADIUS);
    const ang = Math.atan2(dy,dx);
    dx = Math.cos(ang)*dist; dy = Math.sin(ang)*dist;
    joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
    joyVec.x = dx / JOY_RADIUS;
    joyVec.y = dy / JOY_RADIUS;
  }
  function joyReset(){
    joyTouchId = null; joyVec.x = 0; joyVec.y = 0;

    grad.addColorStop(0.45, 'rgba(200,200,200,0.4)');

    ctx.fillStyle = grad;

    const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    grad.addColorStop(0, inner);
    grad.addColorStop(hardness || 0.4, outer);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(cnv);
  }
  const bloodTex = makeTintedTexture('rgba(160,10,18,0.95)', 'rgba(120,6,12,0.5)', 0.5);
  const dustTex  = makeTintedTexture('rgba(196,176,140,0.85)', 'rgba(150,130,100,0.35)', 0.45);
  const scorchTex = makeTintedTexture('rgba(35,28,22,0.95)', 'rgba(35,28,22,0.5)', 0.55);

  const bloodDrops = [];
  function spawnBlood(pos){
    for(let i = 0; i < 8; i++){
      const mat = new THREE.SpriteMaterial({ map: bloodTex, transparent:true, depthWrite:false, opacity:0.9 });
      const spr = new THREE.Sprite(mat);
      const s = 0.035 + Math.random()*0.045;
      spr.scale.set(s, s, 1);
      spr.position.copy(pos).add(new THREE.Vector3((Math.random()-0.5)*0.06, (Math.random()-0.5)*0.06, (Math.random()-0.5)*0.06));
      scene.add(spr);
      bloodDrops.push({
        sprite: spr,
        vel: new THREE.Vector3((Math.random()-0.5)*1.6, Math.random()*1.6, (Math.random()-0.5)*1.6),
        born: performance.now(),
        life: 500 + Math.random()*400
      });
    }
  }
  function updateBlood(dt){
    for(let i = bloodDrops.length - 1; i >= 0; i--){
      const p = bloodDrops[i];
      const t = (performance.now() - p.born) / p.life;
      if(t >= 1 || p.sprite.position.y <= 0){
        scene.remove(p.sprite); p.sprite.material.dispose();
        bloodDrops.splice(i, 1); continue;
      }
      p.vel.y -= 9 * dt;
      p.sprite.position.addScaledVector(p.vel, dt);
      p.sprite.material.opacity = 0.9 * (1 - t*0.6);
    }
  }

  const dustPuffs = [];
  function spawnDust(pos){
    for(let i = 0; i < 6; i++){
      const mat = new THREE.SpriteMaterial({ map: dustTex, transparent:true, depthWrite:false, opacity:0.75 });
      const spr = new THREE.Sprite(mat);
      const s = 0.05 + Math.random()*0.05;
      spr.scale.set(s, s, 1);
      spr.position.copy(pos).add(new THREE.Vector3((Math.random()-0.5)*0.05, (Math.random()-0.5)*0.05, (Math.random()-0.5)*0.05));
      scene.add(spr);
      dustPuffs.push({
        sprite: spr,
        vel: new THREE.Vector3((Math.random()-0.5)*0.9, 0.3 + Math.random()*0.6, (Math.random()-0.5)*0.9),
        born: performance.now(),
        life: 350 + Math.random()*300
      });
    }
  }
  function updateDust(dt){
    for(let i = dustPuffs.length - 1; i >= 0; i--){
      const p = dustPuffs[i];
      const t = (performance.now() - p.born) / p.life;
      if(t >= 1){
        scene.remove(p.sprite); p.sprite.material.dispose();
        dustPuffs.splice(i, 1); continue;
      }
      p.sprite.position.addScaledVector(p.vel, dt);
      p.vel.multiplyScalar(0.9);
      p.sprite.scale.setScalar((0.05 + t*0.06) * (1 + t*2));
      p.sprite.material.opacity = 0.75 * (1 - t);
    }
  }

  // scorch/bullet-hole marks left exactly where a barrier gets hit — this is what
  // shows "that specific spot" of the barrier taking damage, rather than the whole thing
  const scorchMarks = [];
  function spawnScorch(pos, normal){
    const mat = new THREE.SpriteMaterial({ map: scorchTex, transparent:true, depthWrite:false, opacity:0.95 });
    const spr = new THREE.Sprite(mat);
    const s = 0.14 + Math.random()*0.06;
    spr.scale.set(s, s, 1);
    spr.position.copy(pos).addScaledVector(normal, 0.01);
    scene.add(spr);
    scorchMarks.push({ sprite: spr, born: performance.now(), life: 9000 });
  }
  function updateScorch(){
    for(let i = scorchMarks.length - 1; i >= 0; i--){
      const m = scorchMarks[i];
      const t = (performance.now() - m.born) / m.life;
      if(t >= 1){
        scene.remove(m.sprite); m.sprite.material.dispose();
        scorchMarks.splice(i, 1); continue;
      }
      if(t > 0.7) m.sprite.material.opacity = 0.95 * (1 - (t - 0.7) / 0.3);
    }
  }

  // a bullet hitting a house wall just kicks up dust + a scorch mark — houses are
  // permanent structures (cover for villagers), not destructible like the old barriers
  function damageHouse(point, normal){
    spawnDust(point);
    spawnScorch(point, normal);
  }

  // NPC (villager) taking a hit: blood + damage, flees/dies, respawns after a while
  function damageNpc(npc, point, isHeadshot){
    spawnBlood(point);
    npc.hp -= isHeadshot ? npc.maxHp : 1;
    const mat = npc.torso.material;
    mat.emissive = new THREE.Color(0x550000);
    mat.emissiveIntensity = 0.5;
    setTimeout(() => { if(mat) mat.emissiveIntensity = 0; }, 120);
    if(npc.hp <= 0){
      killNpc(npc);
      score += 10;
    } else {
      npc.state = 'flee';
      score += 2;
    }
    scoreEl.textContent = '🎯 ' + score;
  }

  // ---------- gunshot sound: one fixed sample reused every shot (stable, identical,
  // punchy machine-gun report each time) ----------
  let audioCtx = null;
  let sharedShotBuffer = null;

  function buildShotBuffer(){
    const dur = 0.18;
    const size = Math.floor(audioCtx.sampleRate * dur);
    sharedShotBuffer = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
    const data = sharedShotBuffer.getChannelData(0);
    let seed = 1234567;
    function noise(){ // small deterministic PRNG so the sample is reproducible
      seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5;
      seed |= 0;
      return (seed / 2147483648);
    }
    let peak = 0;
    let lpMid = 0, lpLow = 0;
    for(let i = 0; i < size; i++){
      const t = i / size;
      const raw = noise();
      lpMid += (raw - lpMid) * 0.22;  // one-pole smoothing → mid-band rumble (no pure tone)
      lpLow += (raw - lpLow) * 0.045; // heavier smoothing → low-band rumble

      const crackEnv = Math.exp(-t * 26);  // broadband transient — shaped, not raw hiss
      const punchEnv = Math.exp(-t * 12);  // snappy mid punch, carries most of the "bang"
      const boomEnv  = Math.exp(-t * 5.5); // low weight, gives it real weapon-like body

      const crack = raw * crackEnv * 0.75;
      const punch = lpMid * punchEnv * 1.7;
      const boom  = lpLow * boomEnv * 2.1;

      const v = crack + punch + boom;
      data[i] = v;
      if(Math.abs(v) > peak) peak = Math.abs(v);
    }
    if(peak > 0){ for(let i = 0; i < size; i++) data[i] /= peak; } // normalize so tuning above stays predictable
  }

  function ensureAudio(){
    if(audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    buildShotBuffer();
  }

  // mobile browsers only allow starting/resuming audio from inside a direct user
  // gesture — unlock it on the very first touch/click anywhere on the page so it's
  // definitely ready by the time the player fires
  function unlockAudio(){
    ensureAudio();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    window.removeEventListener('touchstart', unlockAudio, true);
    window.removeEventListener('mousedown', unlockAudio, true);
  }
  window.addEventListener('touchstart', unlockAudio, true);
  window.addEventListener('mousedown', unlockAudio, true);

  function playShotSound(){
    try{
      ensureAudio();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const src = audioCtx.createBufferSource();
      src.buffer = sharedShotBuffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(3800, now); // cuts the hissy top end so it's a "bang", not a squeak
      filter.frequency.exponentialRampToValueAtTime(250, now + 0.16);
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.8, now); // loud, punchy — reads clearly as a firearm report
      src.connect(filter).connect(gain).connect(audioCtx.destination);
      src.start(now);
      src.stop(now + 0.19);
    }catch(e){ /* ignore if audio unavailable */ }
  }


  function fire(){
    const now = performance.now();
    if(weaponHolstered) return;
    if(reloading) return;
    if(now - lastFireTime < FIRE_COOLDOWN) return;
    if(ammo <= 0){ startReload(); return; }
    lastFireTime = now;
    ammo -= 1;
    updateAmmoUI();
    boltAnimT = 1;
    recoilKick = Math.min(recoilKick + 0.012, 0.065);

    playShotSound();
    scareNpcsNear(player.position, 26);

    // hip-fire shoots straight from screen centre; once aimed, the bullet is
    // unprojected from the collimator dot's actual screen position, so wherever
    // the dot sits on screen (even raised up, out of the way of the view) is
    // exactly where the round goes
    let dir;
    if(aimT > 0.05){
      const ndcY = (2 * AIM_DOT_OFFSET_PX / window.innerHeight) * aimT;
      aimRaycaster.setFromCamera(new THREE.Vector2(0, ndcY), camera);
      dir = aimRaycaster.ray.direction.clone();
    } else {
      dir = new THREE.Vector3(
        Math.sin(yaw) * Math.cos(pitch),
        Math.sin(pitch),
        Math.cos(yaw) * Math.cos(pitch)
      ).normalize();
    }

    const muzzlePos = new THREE.Vector3();
    gunMuzzleTip.getWorldPosition(muzzlePos);

    spawnMuzzleFlash(muzzlePos);
    spawnSmoke(muzzlePos);

    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.5, 6), tracerMat);
    mesh.position.copy(muzzlePos);
    mesh.quaternion.setFromUnitVectors(UP_AXIS, dir);
    scene.add(mesh);

    bullets.push({ mesh, vel: dir.multiplyScalar(BULLET_SPEED), born: performance.now(), traveled: 0 });
    if(ammo <= 0) startReload();
  }

  function updateBullets(dt){
    for(let i = bullets.length - 1; i >= 0; i--){
      const b = bullets[i];
      const prevPos = b.mesh.position.clone();
      b.vel.y -= BULLET_GRAVITY * dt;
      b.mesh.position.addScaledVector(b.vel, dt);

      const travelled = b.mesh.position.clone().sub(prevPos);
      const dist = travelled.length();
      b.traveled += dist;
      if(dist > 0.0001) b.mesh.quaternion.setFromUnitVectors(UP_AXIS, travelled.clone().normalize());

      let removed = false;
      if(dist > 0){
        raycaster.set(prevPos, travelled.clone().normalize());
        raycaster.far = dist;
        const hits = raycaster.intersectObjects(targets, false);
        let hit = null;
        for(const h of hits){
          const npc = h.object.userData.npc;
          if(npc && !npc.group.visible) continue; // behind cover — bullet passes through, no impact here
          hit = h;
          break;
        }
        if(hit){
          const point = hit.point;
          const normal = (hit.face ? hit.face.normal.clone().transformDirection(hit.object.matrixWorld) : travelled.clone().normalize().negate());
          const npc = hit.object.userData.npc;
          if(npc){
            damageNpc(npc, point, hit.object === npc.head);
          } else if(hit.object.userData.house){
            damageHouse(point, normal);
          }
          removed = true;
        }
      }
      if(!removed && (b.mesh.position.y <= 0 || b.traveled > BULLET_RANGE || performance.now() - b.born > 3500)) removed = true;
      if(removed){ scene.remove(b.mesh); bullets.splice(i, 1); }
    }
  }

  const fireBtn = document.getElementById('fireBtn');
  const altFireBtn = document.getElementById('altFireBtn');

  function wireFireButton(btn){
    let touchId = null;
    let lastXX = 0, lastYY = 0;
    let autoTimer = null;

    function startAt(x, y){
      lastXX = x; lastYY = y;
      btn.classList.add('firing');
      fire();
      autoTimer = setInterval(fire, Math.max(16, FIRE_COOLDOWN - 8));
    }
    function moveAt(x, y){
      const dx = x - lastXX, dy = y - lastYY;
      lastXX = x; lastYY = y;
      const damp = (isMovingNow ? 0.55 : 1) * lookSensitivity;
      yaw -= dx * 0.0045 * damp;
      pitch -= dy * 0.0035 * damp;
      pitch = Math.max(-1.3, Math.min(1.3, pitch));
    }
    function stop(){
      touchId = null;
      btn.classList.remove('firing');
      if(autoTimer){ clearInterval(autoTimer); autoTimer = null; }
    }

    btn.addEventListener('touchstart', (e) => {
      if(btn === altFireBtn && positioningMode) return;
      e.preventDefault();
      if(touchId !== null) return;
      const t = e.changedTouches[0];
      touchId = t.identifier;
      startAt(t.clientX, t.clientY);
    }, { passive:false });

    window.addEventListener('touchmove', (e) => {
      if(touchId === null) return;
      for(const t of e.changedTouches){
        if(t.identifier === touchId) moveAt(t.clientX, t.clientY);
      }
    }, { passive:true });

    function onEnd(e){
      if(touchId === null) return;
      for(const t of e.changedTouches){
        if(t.identifier === touchId) stop();
      }
    }
    window.addEventListener('touchend', onEnd);
    window.addEventListener('touchcancel', onEnd);

    let mouseFiring = false;
    btn.addEventListener('mousedown', (e) => { mouseFiring = true; startAt(e.clientX, e.clientY); });
    window.addEventListener('mousemove', (e) => { if(mouseFiring) moveAt(e.clientX, e.clientY); });
    window.addEventListener('mouseup', () => { if(mouseFiring){ mouseFiring = false; stop(); } });
  }

  wireFireButton(fireBtn);
  wireFireButton(altFireBtn);

  // ---------- settings panel: sensitivity + configurable second fire button ----------
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const settingsClose = document.getElementById('settingsClose');
  const sensSlider = document.getElementById('sensSlider');
  const altFireToggle = document.getElementById('altFireToggle');
  const altSizeSlider = document.getElementById('altSizeSlider');
  const altOpacitySlider = document.getElementById('altOpacitySlider');
  const positionBtn = document.getElementById('positionBtn');
  const posDoneBtn = document.getElementById('posDoneBtn');

  let positioningMode = false;

  sensSlider.addEventListener('input', () => { lookSensitivity = sensSlider.value / 100; });

  settingsBtn.addEventListener('click', () => settingsPanel.classList.add('open'));
  settingsClose.addEventListener('click', () => settingsPanel.classList.remove('open'));

  positionBtn.addEventListener('click', () => {
    settingsPanel.classList.remove('open');
    positioningMode = true;
    posDoneBtn.style.display = 'block';
  });
  posDoneBtn.addEventListener('click', () => {
    positioningMode = false;
    posDoneBtn.style.display = 'none';
    settingsPanel.classList.add('open');
  });

  altFireToggle.addEventListener('change', () => {
    altFireBtn.style.display = altFireToggle.checked ? 'flex' : 'none';
  });
  function applyAltSize(){
    const s = altSizeSlider.value + 'px';
    altFireBtn.style.width = s;
    altFireBtn.style.height = s;
    altFireBtn.style.fontSize = Math.max(9, altSizeSlider.value * 0.15) + 'px';
  }
  function applyAltOpacity(){ altFireBtn.style.opacity = altOpacitySlider.value / 100; }
  altSizeSlider.addEventListener('input', applyAltSize);
  altOpacitySlider.addEventListener('input', applyAltOpacity);
  applyAltSize(); applyAltOpacity();

  let draggingAlt = false;
  function positionAlt(x, y){
    const w = altFireBtn.offsetWidth, h = altFireBtn.offsetHeight;
    altFireBtn.style.left = (x - w/2) + 'px';
    altFireBtn.style.top = (y - h/2) + 'px';
    altFireBtn.style.right = 'auto';
    altFireBtn.style.bottom = 'auto';
  }
  altFireBtn.addEventListener('touchstart', (e) => {
    if(!positioningMode) return;
    e.preventDefault(); e.stopPropagation();
    draggingAlt = true;
    const t = e.changedTouches[0];
    positionAlt(t.clientX, t.clientY);
  }, { passive:false, capture:true });
  altFireBtn.addEventListener('touchmove', (e) => {
    if(!draggingAlt) return;
    e.preventDefault();
    const t = e.changedTouches[0];
    positionAlt(t.clientX, t.clientY);
  }, { passive:false });
  altFireBtn.addEventListener('touchend', () => { draggingAlt = false; });

  // ---------- movement + render loop ----------
  const MOVE_SPEED = 5.5;
  const clock = new THREE.Clock();
  let walkTime = 0;
  let walkSwing = 0;

  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);

    const joyMag = Math.hypot(joyVec.x, joyVec.y);
    const isMoving = joyMag > 0.15;
    isMovingNow = isMoving && grounded;
    const curSpeed = isSprinting && grounded ? MOVE_SPEED * 1.75 : MOVE_SPEED;

    if(isMoving){
      const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
      const right = new THREE.Vector3(-Math.cos(yaw), 0, Math.sin(yaw));
      const move = new THREE.Vector3();
      move.addScaledVector(forward, -joyVec.y);
      move.addScaledVector(right, joyVec.x);
      if(move.lengthSq() > 0){
        move.normalize();
        player.position.addScaledVector(move, curSpeed * dt);
      }
    }

    const targetSwing = isMovingNow ? (isSprinting ? 1.5 : 1) : 0;
    walkSwing += (targetSwing - walkSwing) * Math.min(1, dt * 8);
    walkTime += dt * (isSprinting && isMovingNow ? 13 : 9);

    // gravity / jump — hitting the ground hard after a big fall costs health
    const fallSpeedBefore = velY;
    velY -= 18 * dt;
    player.position.y += velY * dt;
    if(player.position.y <= 0){
      player.position.y = 0;
      if(!grounded && fallSpeedBefore < -9){
        takeDamage(Math.min(45, Math.round((-fallSpeedBefore - 9) * 6)));
      }
      velY = 0; grounded = true;
    }

    player.position.x = Math.max(-190, Math.min(190, player.position.x));
    player.position.z = Math.max(-190, Math.min(190, player.position.z));

    updateBullets(dt);
    updateSmoke(dt);
    updateMuzzleFlashes();
    updateNpcs(dt);
    updateBlood(dt);
    updateDust(dt);
    updateScorch();
    updateClouds(dt);

    // ---- aiming animation: smoothly raise the gun/head to the sight ----
    const targetAimT = aiming ? 1 : 0;
    aimT += (targetAimT - aimT) * Math.min(1, dt * 7);
    gun.position.lerpVectors(gunRestPos, gunAimPos, aimT);
    rightHand.visible = aimT < 0.96; // hide the offset trigger-hand pose once eye is right up on the sight
    const targetFov = 70 - aimT * 32; // 70 -> 38 fully aimed
    camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 9);
    camera.updateProjectionMatrix();
    collimatorEl.classList.toggle('show', aimT > 0.55);
    crosshairEl.style.opacity = 1 - Math.min(1, aimT * 1.6);
    vignetteEl.style.opacity = Math.max(0, (aimT - 0.4) / 0.6) * 0.9;

    // reload animation: magazine drops and a fresh one slides back in,
    // charging handle cycles once near the end
    if(reloading){
      const rp = Math.min(1, (performance.now() - reloadStart) / RELOAD_TIME);
      const dropAmt = rp < 0.5 ? (rp / 0.5) : (1 - (rp - 0.5) / 0.5);
      gun.userData.mag.position.y = gun.userData.magBaseY - dropAmt * 0.16;
      if(rp > 0.88 && !reloadBoltTriggered){ reloadBoltTriggered = true; boltAnimT = 1; }
    }

    recoilKick -= recoilKick * Math.min(1, dt * 9);
    boltAnimT = Math.max(0, boltAnimT - dt * 8);
    const boltOffset = Math.sin(Math.min(1, boltAnimT) * Math.PI) * 0.03;
    gun.userData.bolt.position.z = gun.userData.boltBaseZ + boltOffset;

    // camera
    const effPitch = pitch + recoilKick;
    const lookDir = new THREE.Vector3(
      Math.sin(yaw) * Math.cos(effPitch),
      Math.sin(effPitch),
      Math.cos(yaw) * Math.cos(effPitch)
    );

    const bobAmt = walkSwing * (1 - aimT * 0.85); // steadier while aiming
    const bobY = Math.sin(walkTime * 2) * 0.036 * bobAmt;
    const bobX = Math.sin(walkTime) * 0.02 * bobAmt;
    const eye = player.position.clone();
    eye.y += PLAYER_EYE_HEIGHT + bobY;
    const rightVec = new THREE.Vector3(-Math.cos(yaw), 0, Math.sin(yaw));
    eye.addScaledVector(rightVec, bobX);
    camera.position.copy(eye);
    camera.lookAt(eye.clone().add(lookDir));

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта безопасности дорог</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f1115;
    color: #e8e8e8;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #mapWrap {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
  }
  #map {
    position: absolute;
    inset: 0;
  }
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 16px;
    background: #171a21;
    border-bottom: 1px solid #2a2e37;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
  }
  .hint {
    font-size: 12px;
    color: #9aa1ac;
  }
  .notice {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: #171a21d0;
    border: 1px solid #2a2e37;
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 12px;
    color: #9aa1ac;
    z-index: 500;
    white-space: nowrap;
    pointer-events: none;
    max-width: 90%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .legend-toggle {
    position: fixed;
    top: 50%;
    left: 12px;
    transform: translateY(-50%);
    padding: 8px 12px;
    border-radius: 20px;
    background: #171a21e0;
    border: 1px solid #2a2e37;
    color: #e8e8e8;
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
    z-index: 900;
  }
  .legend {
    position: fixed;
    top: calc(50% + 44px);
    left: 12px;
    background: #171a21e0;
    border: 1px solid #2a2e37;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 12px;
    z-index: 900;
    line-height: 1.8;
    display: none;
  }
  .legend.open { display: block; }

  .geo-toggle {
    position: fixed;
    top: 12px;
    right: 12px;
    padding: 8px 12px;
    border-radius: 20px;
    background: #16a34ae0;
    border: 1px solid #15803d;
    color: white;
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
    z-index: 900;
  }
  .sos-toggle {
    position: fixed;
    top: 58px;
    right: 12px;
    padding: 8px 12px;
    border-radius: 20px;
    background: #dc2626e0;
    border: 1px solid #991b1b;
    color: white;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
    z-index: 900;
  }
  .sos-toggle.active {
    background: #7f1d1d;
    animation: sos-btn-pulse 1s ease-in-out infinite;
  }
  @keyframes sos-btn-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.6); }
    50% { box-shadow: 0 0 0 8px rgba(220,38,38,0); }
  }

  /* Пульсирующая метка "Тревога" на карте */
  .sos-marker-wrap {
    width: 26px;
    height: 26px;
    position: relative;
  }
  .sos-marker-dot {
    position: absolute;
    top: 8px; left: 8px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #dc2626;
    border: 2px solid #fff;
  }
  .sos-marker-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: rgba(220,38,38,0.35);
    animation: sos-ring 1.4s ease-out infinite;
  }
  @keyframes sos-ring {
    0% { transform: scale(0.3); opacity: 1; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  /* Орбита БПЛА над зоной угрозы */
  .drone-orbit {
    width: 56px;
    height: 56px;
    position: relative;
    animation: drone-spin 5s linear infinite;
  }
  .drone-icon {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    animation: drone-counter-spin 5s linear infinite;
  }
  @keyframes drone-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes drone-counter-spin {
    from { transform: translateX(-50%) rotate(0deg); }
    to { transform: translateX(-50%) rotate(-360deg); }
  }
  .wreck-icon {
    font-size: 26px;
    text-align: center;
    line-height: 1;
  }
  .legend span.dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 6px;
  }
  /* Модальное окно добавления отметки */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #171a21;
    border: 1px solid #2a2e37;
    border-radius: 14px;
    padding: 20px;
    width: 320px;
    max-width: 90vw;
  }
  .modal h2 {
    font-size: 15px;
    margin: 0 0 14px 0;
  }
  .modal label {
    display: block;
    font-size: 12px;
    color: #9aa1ac;
    margin: 12px 0 4px;
  }
  .modal input[type="range"] {
    padding: 0;
    accent-color: #3b82f6;
  }
  .modal select, .modal input, .modal textarea {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #2a2e37;
    background: #0f1115;
    color: #e8e8e8;
    font-size: 14px;
  }
  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }
  .btn {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-primary { background: #3b82f6; color: white; }
  .btn-secondary { background: #2a2e37; color: #e8e8e8; }

  .popup-actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .popup-actions button {
    flex: 1;
    padding: 6px;
    border-radius: 6px;
    border: none;
    font-size: 12px;
    cursor: pointer;
  }
  .btn-confirm { background: #16a34a; color: white; }
  .btn-deny { background: #dc2626; color: white; }
  .btn-delete { background: #4b5563; color: white; }
  .stale-badge {
    display: inline-block;
    background: #7c2d12;
    color: #fed7aa;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 4px;
  }

  /* Чат */
  .chat-toggle {
    position: fixed;
    bottom: 20px;
    right: 12px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #3b82f6;
    color: white;
    border: none;
    font-size: 20px;
    cursor: pointer;
    z-index: 900;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .chat-panel {
    position: fixed;
    bottom: 80px;
    right: 12px;
    width: 300px;
    max-width: 85vw;
    height: 50vh;
    max-height: 50vh;
    background: #171a21;
    border: 1px solid #2a2e37;
    border-radius: 14px;
    z-index: 900;
    display: none;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .chat-panel.open {
    display: flex;
    opacity: 1;
    transform: translateY(0);
  }
  .chat-header {
    padding: 12px 14px;
    border-bottom: 1px solid #2a2e37;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex: 0 0 auto;
  }
  .chat-header b { font-size: 14px; }
  .chat-close {
    background: none;
    border: none;
    color: #9aa1ac;
    font-size: 18px;
    cursor: pointer;
  }
  .chat-messages {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .chat-msg {
    font-size: 13px;
    line-height: 1.4;
  }
  .chat-msg .who {
    font-size: 11px;
    color: #6b91d6;
    font-weight: 600;
  }
  .chat-msg .when {
    font-size: 10px;
    color: #666;
    margin-left: 6px;
  }
  .chat-msg .text {
    margin-top: 2px;
    word-break: break-word;
  }
  .chat-input-row {
    flex: 0 0 auto;
    display: flex;
    gap: 6px;
    padding: 10px 14px;
    border-top: 1px solid #2a2e37;
  }
  .chat-input-row input {
    flex: 1;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #2a2e37;
    background: #0f1115;
    color: #e8e8e8;
    font-size: 13px;
  }
  .chat-input-row button {
    padding: 8px 12px;
    border-radius: 8px;
    border: none;
    background: #3b82f6;
    color: white;
    font-size: 13px;
    cursor: pointer;
  }

  /* Экран загрузки */
  #splash {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 2000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.5s ease;
  }
  #splash.fade-out {
    opacity: 0;
    pointer-events: none;
  }
  #splash img {
    width: 140px;
    height: 140px;
    border-radius: 28px;
    box-shadow: 0 0 40px rgba(220, 38, 38, 0.35);
    animation: splash-pulse 1.8s ease-in-out infinite;
  }
  @keyframes splash-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
</style>
</head>
<body>

<div id="splash">
  <img src="logo.png" alt="Логотип">
</div>

<header>
  <h1>🗺️ Карта безопасности дорог</h1>
  <span class="hint">Клик по карте — добавить отметку</span>
</header>

<div id="mapWrap">
  <div id="map"></div>

  <div class="notice">Не забывайте удалять неактуальное и писать время</div>

  <button class="legend-toggle" id="legendToggle">Памятка</button>

  <div class="legend" id="legendPanel">
    <div><span class="dot" style="background:#dc2626"></span>БПЛА-угроза</div>
    <div><span class="dot" style="background:#f59e0b"></span>Повреждённая техника</div>
    <div><span class="dot" style="background:#a855f7"></span>Другое</div>
  </div>

  <button class="geo-toggle" id="geoMarkBtn">📍 Отметить здесь</button>
  <button class="sos-toggle" id="sosBtn">🚨 Тревога</button>

  <button class="chat-toggle" id="chatToggle">💬</button>

  <div class="chat-panel" id="chatPanel">
    <div class="chat-header">
      <b>Общий чат</b>
      <button class="chat-close" id="chatClose">✕</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="Сообщение..." maxlength="300">
      <button id="chatSend">➤</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Новая отметка</h2>

    <label>Тип угрозы</label>
    <select id="markType">
      <option value="uav">БПЛА-угроза</option>
      <option value="wreck">Повреждённая техника на дороге</option>
      <option value="other">Другое</option>
    </select>

    <div id="uavFields">
      <label>Тип БПЛА</label>
      <select id="uavSubtype">
        <option value="recon">Разведывательный</option>
        <option value="fpv">FPV / камикадзе</option>
        <option value="bomber">Сброс боеприпасов</option>
        <option value="unknown">Неизвестно</option>
      </select>

      <label>Радиус угрозы: <span id="radiusValue">500</span> м</label>
      <input type="range" id="uavRadius" min="100" max="5000" step="100" value="500">
    </div>

    <label>Комментарий (необязательно)</label>
    <textarea id="markComment" rows="2" placeholder="Например: замечен 20 мин назад, направление движения..."></textarea>

    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancelBtn">Отмена</button>
      <button class="btn btn-primary" id="saveBtn">Сохранить</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, addDoc, onSnapshot,
    doc, setDoc, updateDoc, deleteDoc, arrayUnion, serverTimestamp,
    query, orderBy, limit
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Локальный ID устройства — чтобы определить "своя" ли отметка (для показа кнопки удаления).
  // Это не настоящая аутентификация, просто удобство: сама защита от чужого удаления настраивается в Firestore Rules.
  function getOwnerId() {
    let id = localStorage.getItem('ownerId');
    if (!id) {
      id = 'u_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('ownerId', id);
    }
    return id;
  }
  const OWNER_ID = getOwnerId();

  function getNickname() {
    let name = localStorage.getItem('nickname');
    if (!name) {
      name = 'Гость_' + OWNER_ID.slice(2, 6);
      localStorage.setItem('nickname', name);
    }
    return name;
  }
  const NICKNAME = getNickname();

  // ЗАПОЛНИТЕ СВОИМИ ДАННЫМИ ИЗ FIREBASE CONSOLE
  const firebaseConfig = {
    apiKey: "AIzaSyBWhYlPdhSllNXh6aOoJnOV58XUQcgsNfI",
    authDomain: "angel-svo.firebaseapp.com",
    projectId: "angel-svo",
    storageBucket: "angel-svo.firebasestorage.app",
    messagingSenderId: "701491399396",
    appId: "1:701491399396:web:45fcdf0124d001705cfaf1",
    measurementId: "G-32F0BEZPL5"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const marksCollection = collection(db, "marks");
  const chatCollection = collection(db, "chat");
  const alertsCollection = collection(db, "alerts");

  // ---- Карта ----
  // Область: Донецкая, Луганская, Запорожская
  const REGION_BOUNDS = L.latLngBounds([46.0, 34.0], [49.8, 40.2]);

  const map = L.map('map', {
    maxBounds: REGION_BOUNDS.pad(0.1),
    maxBoundsViscosity: 0.8
  });
  map.fitBounds(REGION_BOUNDS);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19,
    minZoom: 7
  }).addTo(map);

  // Экран загрузки: скрываем, как только карта отрисовалась (плюс минимум 1.2с, чтобы не мигало)
  const splashStart = Date.now();
  map.whenReady(() => {
    const elapsed = Date.now() - splashStart;
    const wait = Math.max(0, 1200 - elapsed);
    setTimeout(() => {
      const splash = document.getElementById('splash');
      splash.classList.add('fade-out');
      setTimeout(() => splash.remove(), 600);
    }, wait);
  });

  const STALE_HOURS = 12; // через сколько часов без подтверждений отметка считается неактуальной

  const typeMeta = {
    uav:   { color: '#dc2626', label: 'БПЛА-угроза' },
    wreck: { color: '#f59e0b', label: 'Повреждённая техника' },
    other: { color: '#a855f7', label: 'Другое' }
  };

  const uavSubtypeLabels = {
    recon: 'Разведывательный',
    fpv: 'FPV / камикадзе',
    bomber: 'Сброс боеприпасов',
    unknown: 'Неизвестно'
  };

  const markersById = {};
  const dataById = {};

  function timeAgo(ts) {
    if (!ts) return 'только что';
    const diffMs = Date.now() - ts.toDate().getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'только что';
    if (mins < 60) return `${mins} мин назад`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs} ч назад`;
    return `${Math.floor(hrs / 24)} дн назад`;
  }

  const EXPIRE_MINUTES = 30; // через сколько минут отметка автоматически удаляется

  function buildPopupContent(id, data) {
    const meta = typeMeta[data.type] || typeMeta.other;
    const confirmedBy = data.confirmedBy || [];
    const deniedBy = data.deniedBy || [];
    const alreadyVoted = confirmedBy.includes(OWNER_ID) || deniedBy.includes(OWNER_ID);
    const isStale = data.createdAt && (Date.now() - data.createdAt.toDate().getTime()) > STALE_HOURS * 3600 * 1000
      && confirmedBy.length <= deniedBy.length;

    let html = `<div style="min-width:180px">`;
    html += `<b>${meta.label}</b>`;
    if (isStale) html += `<span class="stale-badge">Возможно неактуально</span>`;
    if (data.type === 'uav' && data.subtype) {
      html += `<div style="font-size:12px;color:#666;margin-top:2px">${uavSubtypeLabels[data.subtype] || data.subtype}</div>`;
    }
    if (data.comment) {
      html += `<div style="font-size:12px;margin-top:6px">${escapeHtml(data.comment)}</div>`;
    }
    html += `<div style="font-size:11px;color:#888;margin-top:6px">${timeAgo(data.createdAt)} · 👍 ${confirmedBy.length} · 👎 ${deniedBy.length}</div>`;
    if (alreadyVoted) {
      html += `<div style="font-size:11px;color:#666;margin-top:6px">Вы уже отметили эту метку</div>`;
    } else {
      html += `<div class="popup-actions">
        <button class="btn-confirm" onclick="window.__confirmMark('${id}')">Актуально</button>
        <button class="btn-deny" onclick="window.__denyMark('${id}')">Не актуально</button>
      </div>`;
    }
    if (data.ownerId === OWNER_ID) {
      html += `<div class="popup-actions">
        <button class="btn-delete" onclick="window.__deleteMark('${id}')">Удалить мою отметку</button>
      </div>`;
    }
    html += `</div>`;
    return html;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderMark(id, data) {
    const meta = typeMeta[data.type] || typeMeta.other;
    if (markersById[id]) {
      markersById[id].marker.setPopupContent(buildPopupContent(id, data));
      return;
    }
    let marker;
    let droneMarker = null;
    if (data.type === 'uav' && data.radius) {
      marker = L.circle([data.lat, data.lng], {
        radius: data.radius,
        fillColor: meta.color,
        color: meta.color,
        weight: 2,
        fillOpacity: 0.2
      }).addTo(map);
      const droneIcon = L.divIcon({
        className: '',
        html: '<div class="drone-orbit"><div class="drone-icon">🛸</div></div>',
        iconSize: [56, 56],
        iconAnchor: [28, 28]
      });
      droneMarker = L.marker([data.lat, data.lng], { icon: droneIcon, interactive: false }).addTo(map);
    } else if (data.type === 'wreck') {
      const wreckIcon = L.divIcon({
        className: '',
        html: '<div class="wreck-icon">🔥🚗</div>',
        iconSize: [40, 30],
        iconAnchor: [20, 15]
      });
      marker = L.marker([data.lat, data.lng], { icon: wreckIcon }).addTo(map);
    } else {
      marker = L.circleMarker([data.lat, data.lng], {
        radius: 9,
        fillColor: meta.color,
        color: '#fff',
        weight: 2,
        fillOpacity: 0.9
      }).addTo(map);
    }
    marker.bindPopup(buildPopupContent(id, data));
    markersById[id] = { marker, droneMarker };
    dataById[id] = data;
  }

  // Автоматическое удаление отметок старше EXPIRE_MINUTES.
  // Проверка идёт на стороне клиента (без Cloud Functions), поэтому
  // отметка исчезнет, как только кто-то из открытых вкладок её обнаружит просроченной.
  setInterval(() => {
    const now = Date.now();
    Object.keys(dataById).forEach((id) => {
      const data = dataById[id];
      if (!data.createdAt) return;
      const ageMin = (now - data.createdAt.toDate().getTime()) / 60000;
      if (ageMin > EXPIRE_MINUTES) {
        deleteDoc(doc(db, 'marks', id)).catch(() => {});
      }
    });
  }, 30000);

  // Слушаем изменения в реальном времени
  onSnapshot(marksCollection, (snapshot) => {
    snapshot.docChanges().forEach((change) => {
      const id = change.doc.id;
      const data = change.doc.data();
      if (change.type === 'removed') {
        if (markersById[id]) {
          map.removeLayer(markersById[id].marker);
          if (markersById[id].droneMarker) map.removeLayer(markersById[id].droneMarker);
          delete markersById[id];
        }
        delete dataById[id];
      } else {
        renderMark(id, data);
      }
    });
  });

  window.__confirmMark = async (id) => {
    await updateDoc(doc(db, 'marks', id), { confirmedBy: arrayUnion(OWNER_ID) });
  };
  window.__denyMark = async (id) => {
    await updateDoc(doc(db, 'marks', id), { deniedBy: arrayUnion(OWNER_ID) });
  };
  window.__deleteMark = async (id) => {
    if (!confirm('Удалить эту отметку?')) return;
    await deleteDoc(doc(db, 'marks', id));
  };

  // ---- Добавление новой отметки ----
  let pendingLatLng = null;
  const overlay = document.getElementById('modalOverlay');
  const typeSelect = document.getElementById('markType');
  const uavFields = document.getElementById('uavFields');

  typeSelect.addEventListener('change', () => {
    uavFields.style.display = typeSelect.value === 'uav' ? 'block' : 'none';
  });

  const radiusInput = document.getElementById('uavRadius');
  const radiusValue = document.getElementById('radiusValue');
  radiusInput.addEventListener('input', () => {
    radiusValue.textContent = radiusInput.value;
  });

  map.on('click', (e) => {
    pendingLatLng = e.latlng;
    modalTitle.textContent = 'Новая отметка';
    overlay.classList.add('open');
  });

  document.getElementById('cancelBtn').addEventListener('click', () => {
    overlay.classList.remove('open');
    pendingLatLng = null;
  });

  document.getElementById('saveBtn').addEventListener('click', async () => {
    if (!pendingLatLng) return;
    const type = typeSelect.value;
    const comment = document.getElementById('markComment').value.trim();
    const payload = {
      type,
      lat: pendingLatLng.lat,
      lng: pendingLatLng.lng,
      comment,
      confirmedBy: [],
      deniedBy: [],
      ownerId: OWNER_ID,
      createdAt: serverTimestamp()
    };
    if (type === 'uav') {
      payload.subtype = document.getElementById('uavSubtype').value;
      payload.radius = Number(radiusInput.value);
    }
    await addDoc(marksCollection, payload);
    overlay.classList.remove('open');
    document.getElementById('markComment').value = '';
    pendingLatLng = null;
  });

  // ---- Быстрая метка по геолокации ----
  const geoMarkBtn = document.getElementById('geoMarkBtn');
  const modalTitle = document.getElementById('modalTitle');

  geoMarkBtn.addEventListener('click', () => {
    if (!navigator.geolocation) {
      alert('Геолокация не поддерживается этим браузером.');
      return;
    }
    geoMarkBtn.textContent = '📍 Определяю...';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        geoMarkBtn.textContent = '📍 Отметить здесь';
        pendingLatLng = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        modalTitle.textContent = 'Новая отметка (моё местоположение)';
        overlay.classList.add('open');
      },
      () => {
        geoMarkBtn.textContent = '📍 Отметить здесь';
        alert('Не удалось определить местоположение. Проверьте разрешения геолокации.');
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });

  // ---- Тревога (SOS) ----
  const sosBtn = document.getElementById('sosBtn');
  let sosWatchId = null;
  let sosActive = false;

  function stopSos() {
    if (sosWatchId !== null) {
      navigator.geolocation.clearWatch(sosWatchId);
      sosWatchId = null;
    }
    sosActive = false;
    sosBtn.textContent = '🚨 Тревога';
    sosBtn.classList.remove('active');
    deleteDoc(doc(db, 'alerts', OWNER_ID)).catch(() => {});
  }

  function startSos() {
    if (!navigator.geolocation) {
      alert('Геолокация не поддерживается этим браузером.');
      return;
    }
    sosActive = true;
    sosBtn.textContent = '🚨 Отменить тревогу';
    sosBtn.classList.add('active');
    sosWatchId = navigator.geolocation.watchPosition(
      (pos) => {
        setDoc(doc(db, 'alerts', OWNER_ID), {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          ownerId: OWNER_ID,
          nickname: NICKNAME,
          updatedAt: serverTimestamp()
        }).catch(() => {});
      },
      () => {
        alert('Не удалось определить местоположение для тревоги.');
        stopSos();
      },
      { enableHighAccuracy: true }
    );
  }

  sosBtn.addEventListener('click', () => {
    if (sosActive) {
      if (confirm('Отменить тревогу?')) stopSos();
    } else {
      if (confirm('Включить тревогу? Ваше местоположение будет видно всем на карте, пока вы её не отмените.')) startSos();
    }
  });

  // Показ чужих (и своей) тревог на карте в реальном времени
  const sosMarkersById = {};
  onSnapshot(alertsCollection, (snapshot) => {
    snapshot.docChanges().forEach((change) => {
      const id = change.doc.id;
      if (change.type === 'removed') {
        if (sosMarkersById[id]) {
          map.removeLayer(sosMarkersById[id]);
          delete sosMarkersById[id];
        }
        return;
      }
      const data = change.doc.data();
      if (!data.lat || !data.lng) return;
      const icon = L.divIcon({
        className: '',
        html: '<div class="sos-marker-wrap"><div class="sos-marker-ring"></div><div class="sos-marker-dot"></div></div>',
        iconSize: [26, 26],
        iconAnchor: [13, 13]
      });
      if (sosMarkersById[id]) {
        sosMarkersById[id].setLatLng([data.lat, data.lng]);
      } else {
        const m = L.marker([data.lat, data.lng], { icon, zIndexOffset: 1000 }).addTo(map);
        m.bindPopup(`<b>🚨 Тревога</b><div style="font-size:12px;margin-top:4px">${escapeHtml(data.nickname || 'Пользователь')}</div>`);
        sosMarkersById[id] = m;
      }
    });
  });

  // ---- Чат ----
  const chatToggle = document.getElementById('chatToggle');
  const chatPanel = document.getElementById('chatPanel');
  const chatClose = document.getElementById('chatClose');
  const chatMessages = document.getElementById('chatMessages');
  const chatInput = document.getElementById('chatInput');
  const chatSend = document.getElementById('chatSend');

  chatToggle.addEventListener('click', () => {
    chatPanel.classList.add('open');
  });
  chatClose.addEventListener('click', () => {
    chatPanel.classList.remove('open');
  });

  function chatTimeLabel(ts) {
    if (!ts) return '';
    const d = ts.toDate();
    return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }

  const chatQuery = query(chatCollection, orderBy('createdAt', 'asc'), limit(200));
  onSnapshot(chatQuery, (snapshot) => {
    chatMessages.innerHTML = '';
    snapshot.forEach((docSnap) => {
      const m = docSnap.data();
      const row = document.createElement('div');
      row.className = 'chat-msg';
      row.innerHTML = `<span class="who">${escapeHtml(m.sender || 'Гость')}</span><span class="when">${chatTimeLabel(m.createdAt)}</span>
        <div class="text">${escapeHtml(m.text || '')}</div>`;
      chatMessages.appendChild(row);
    });
    chatMessages.scrollTop = chatMessages.scrollHeight;
  });

  async function sendChatMessage() {
    const text = chatInput.value.trim();
    if (!text) return;
    chatInput.value = '';
    await addDoc(chatCollection, {
      text,
      sender: NICKNAME,
      createdAt: serverTimestamp()
    });
  }

  chatSend.addEventListener('click', sendChatMessage);
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendChatMessage();
  });

  // ---- Легенда ----
  const legendToggle = document.getElementById('legendToggle');
  const legendPanel = document.getElementById('legendPanel');
  legendToggle.addEventListener('click', () => {
    legendPanel.classList.toggle('open');
  });

</script>
</body>
</html>
